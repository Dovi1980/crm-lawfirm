version: '3.8'

# Production stack: 3 services (db, backend, nginx). The SPA is built into the
# nginx image at build time — no Node container, no live reload, no source
# volumes mounted. Run with:
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  db:
    image: postgres:15-alpine
    container_name: crm_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-crm_lawfirm}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - crm_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-crm_lawfirm}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crm_backend
    restart: always
    # No --reload in production. No source volume mount.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --proxy-headers --forwarded-allow-ips="*"
    volumes:
      - attachments_data:/data/attachments
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL_DOCKER:-postgresql+asyncpg://postgres:postgres_secure_pass@db:5432/crm_lawfirm}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - crm_network

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile.prod
    container_name: crm_nginx
    restart: always
    ports:
      - "${DOCKER_NGINX_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - crm_network

volumes:
  postgres_data:
  attachments_data:

networks:
  crm_network:
    driver: bridge
