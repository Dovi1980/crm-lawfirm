user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/log/nginx/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Static file caching for built assets (hashed filenames → immutable)
    map $sent_http_content_type $static_cache_control {
        default                                "no-cache";
        "application/javascript"               "public, max-age=31536000, immutable";
        "text/css"                             "public, max-age=31536000, immutable";
        "image/png"                            "public, max-age=31536000, immutable";
        "image/jpeg"                           "public, max-age=31536000, immutable";
        "image/svg+xml"                        "public, max-age=31536000, immutable";
        "font/woff2"                           "public, max-age=31536000, immutable";
    }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Mandatory Security Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        # HSTS — enable only when serving over HTTPS in front of this container.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # CSP without unsafe-inline / unsafe-eval. Vite's prod build emits hashed
        # external assets so no inline scripts are needed.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self';" always;

        # Backend REST API proxy
        location /api {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SPA static assets — long cache on hashed filenames
        location /assets/ {
            add_header Cache-Control $static_cache_control always;
            try_files $uri =404;
        }

        # SPA fallback: every unknown route returns index.html so React Router can resolve it
        location / {
            add_header Cache-Control "no-cache" always;
            try_files $uri $uri/ /index.html;
        }
    }
}
